[package]
name = "s-dock"
description = "A dock for Hyprland, companion to ashell-ru"
license = "MIT"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[profile.release]
lto = "thin"
strip = true
opt-level = 3
# A panic must not take down the whole shell bar.
panic = "unwind"

[dependencies]
iced = { package = "iced_layershell", git = "https://github.com/MalpenZibo/iced_layershell", tag = "v0.1.5", default-features = false, features = [
  "tokio",
  "advanced",
  # Software renderer only: wgpu re-inits its GLES context on every new
  # layer surface ("Re-initializing Gles context"), which freezes frames,
  # loses textures (vanishing icons) and makes the dock look dead.
  "tiny-skia",
  "image",
  "svg",
] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "rt-multi-thread", "process", "time", "io-util", "sync", "macros"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
toml = "0.9"
anyhow = "1"
log = { version = "0.4", features = [] }
flexi_logger = "0.31"
clap = { version = "4.5", default-features = false, features = [
  "std",
  "derive",
] }
inotify = { version = "0.11.1", default-features = false, features = ["stream"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
hex_color = { version = "3", features = ["serde"] }
libc = "0.2"
hyprland = "0.4.0-beta.2"
freedesktop-icons = "0.4"
linicon-theme = "1.2.0"
shellexpand = { version = "3", features = ["path"] }
freedesktop-desktop-entry = "0.8.1"
image = "0.25"

# Without this patch tiny-skia renders through softbuffer WITHOUT an alpha
# channel: anything not drawn by a widget becomes opaque black, and
# translucent dock backgrounds lose their transparency (copied from ashell-ru,
# which hit the same problem).
[patch.crates-io]
softbuffer = { git = "https://github.com/MalpenZibo/softbuffer", branch = "wayland-argb" }
