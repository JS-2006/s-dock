# Пример конфигурации s-dock
# Положить в ~/.config/s-dock/config.toml
# Все поля опциональны — отсутствующие берут значения по умолчанию.

log_level = "info"          # warn|info|debug|trace

position = "bottom"         # bottom | top | left | right
alignment = "center"        # center | start | end
mode = "fixed"              # fixed (резервирует место) | popup (по хотспоту)

[appearance]
icon_size = 40
dock_size = 64              # толщина дока, px
width = "fit"               # fit (по контенту) | full (весь экран)
margin = 6
spacing = 8
opacity = 1.0               # прозрачность подложки дока, 0..1
background_color = "#1e1e2ecc"
border_radius = 18
border_color = "#89b4fa00"
hover_scale = 1.3           # увеличение иконки под курсором
show_running_indicator = true
running_indicator_color = "#89b4fa"
running_indicator_size = 5

[popup]
hotspot_width = "dock"      # "dock" — во всю ширину края, или число px
hotspot_height = 8
autohide_timeout = 3        # сек без курсора на доке до скрытия; 0 = не скрывать

[launcher]
enabled = true
label = "🚀"                # эмодзи или текст
cmd = ""                    # напр. "fuzzel"
position = "start"          # start | end — где кнопка в ряду дока (относительно приложений)
text_color = "#cdd6f4"
opacity = 1.0               # прозрачность надписи кнопки, 0..1
